<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>뉴스 카드 제작</title>

  <!-- 1. 카드 입력·미리보기 화면 스타일 -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #18202c;
      font-family: "Malgun Gothic", sans-serif;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .description {
      color: #596273;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: white;
      border: 1px solid #e0e4ea;
      border-radius: 16px;
      padding: 24px;
    }

    h2 {
      margin: 0 0 24px;
      font-size: 19px;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: 700;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #bcc4cf;
      border-radius: 8px;
      font: inherit;
      line-height: 1.6;
    }

    textarea {
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #18202c;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      font-size: 14px;
      line-height: 1.6;
    }

    #preview {
      display: block;
      width: 100%;
      border-radius: 8px;
    }

    #preview[hidden],
    #download[hidden] {
      display: none;
    }

    #placeholder {
      padding: 70px 16px;
      border: 1px dashed #bcc4cf;
      border-radius: 8px;
      text-align: center;
      color: #596273;
      line-height: 1.8;
    }

    #download {
      display: block;
      margin-top: 18px;
      color: #1d4ed8;
      font-weight: 700;
    }

    .hint {
      color: #596273;
      font-size: 13px;
      line-height: 1.7;
    }

    /* 좁은 화면에서는 입력과 미리보기를 세로로 배치 */
    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>뉴스 카드 제작</h1>
    <p class="description">
      키워드와 문장을 입력해 검정 배경 카드를 만들어보세요.
      내용을 수정한 뒤 다시 생성할 수 있습니다.
    </p>

    <div class="layout">
      <!-- 2. 키워드·제목·본문 입력 및 이미지 생성 버튼 -->
      <section class="panel">
        <h2>카드 내용</h2>

        <form id="card-form">
          <label for="keyword">키워드</label>
          <input id="keyword" maxlength="30" value="콘텐츠 제작">

          <label for="headline">제목</label>
          <textarea id="headline" rows="3" maxlength="70" required>하나의 기사로 만드는 새로운 콘텐츠</textarea>

          <label for="body">본문</label>
          <textarea id="body" rows="6" maxlength="180">사용자가 핵심 키워드와 방향을 선택하고, AI가 플랫폼에 맞는 초안 제작을 돕습니다.</textarea>

          <p class="hint">
            현재는 카드 한 장을 확인하는 단계입니다.
            긴 문장은 이미지에서 잘리지 않는지 확인해주세요.
          </p>

          <button id="generate" type="submit">
            카드 이미지 만들기
          </button>
          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <!-- 3. 생성된 이미지 미리보기 및 다운로드 링크 -->
      <section class="panel">
        <h2>생성된 카드</h2>

        <div id="placeholder">
          왼쪽 내용을 입력하고<br>
          ‘카드 이미지 만들기’를 눌러주세요.
        </div>

        <img id="preview" alt="생성된 검정 배경 뉴스 카드" hidden>
        <a id="download" hidden>카드 이미지 다운로드</a>
      </section>
    </div>
  </main>

  <!-- 4. 화면 코드보다 먼저 공통 서버 요청 모듈 로드 -->
  <script src="/api.js"></script>

  <script>
    // 5. 화면 제어에 사용할 요소 조회
    const form = document.getElementById("card-form");
    const button = document.getElementById("generate");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const placeholder = document.getElementById("placeholder");
    const download = document.getElementById("download");

    // 6. 이미지 생성 후 내용을 수정하면 재생성 안내 표시
    // 이전 이미지의 다운로드 링크는 숨깁니다.
    form.addEventListener("input", () => {
      if (!preview.hidden) {
        status.textContent =
          "내용이 수정되었습니다. 다시 생성하면 이미지에 반영됩니다.";
        download.hidden = true;
      }
    });

    // 7. 카드 이미지 생성 요청 처리
    form.addEventListener("submit", async (event) => {
      // 폼 제출로 페이지가 새로고침되는 것을 방지
      event.preventDefault();

      const headline = document
        .getElementById("headline")
        .value.trim();

      // 공백만 입력한 제목도 필수 입력 오류로 처리
      if (!headline) {
        status.textContent = "제목을 입력해주세요.";
        return;
      }

      // 8. 기존 /render API에 전달할 카드 데이터 구성
      // AI 원고 생성이 아닌, 사용자가 입력한 글의 이미지 출력입니다.
      const payload = {
        card_id: "card_" + crypto.randomUUID(),
        template: "text_only",
        content: {
          keyword: document.getElementById("keyword").value.trim(),
          headline,
          body: document.getElementById("body").value.trim(),
        },
      };

      // 9. 생성 중 중복 제출과 입력 변경 방지
      button.disabled = true;
      button.textContent = "이미지 만드는 중...";
      status.textContent = "카드 이미지를 생성하고 있습니다.";

      preview.hidden = true;
      download.hidden = true;
      placeholder.hidden = false;
      placeholder.textContent = "이미지를 만드는 중입니다.";

      const fields = form.querySelectorAll("input, textarea");
      fields.forEach((field) => {
        field.disabled = true;
      });

      try {
        // 10. 서버 통신은 api.js에 위임
        // 요청·JSON 변환·응답 오류 확인은 이 함수에서 처리합니다.
        const result = await NewsApi.renderLegacyCard(payload);

        // 서버가 반환한 파일명으로 이미지 주소 구성
        const imagePath =
          "/output/" + encodeURIComponent(result.file_name);

        // 11. 이미지 로딩이 완료된 후 미리보기 표시
        // 이미지 자체를 불러오지 못한 경우도 오류로 처리합니다.
        await new Promise((resolve, reject) => {
          preview.onload = resolve;
          preview.onerror = () => reject(
            new Error("생성된 이미지를 불러오지 못했습니다.")
          );
          preview.src = imagePath;
        });

        preview.hidden = false;
        placeholder.hidden = true;

        // 12. 생성된 이미지의 다운로드 링크 설정
        download.href = imagePath;
        download.download = result.file_name;
        download.hidden = false;

        status.textContent =
          "완료! 오른쪽 카드를 확인하고 다운로드해주세요.";
      } catch (error) {
        // 13. 서버 요청 또는 이미지 로딩 오류 표시
        status.textContent = "오류: " + error.message;
        placeholder.textContent =
          "생성에 실패했습니다. 오류 문구를 확인해주세요.";
      } finally {
        // 14. 성공·실패와 관계없이 입력 및 버튼 활성화
        fields.forEach((field) => {
          field.disabled = false;
        });

        button.disabled = false;
        button.textContent = "카드 이미지 만들기";
      }
    });
  </script>
</body>

</html>
