services:
  - type: web
    name: ainewsroom-proxy
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ""
    startCommand: python server.py
    healthCheckPath: /ai/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: RATE_LIMIT_PER_MIN
        value: "120"
