# Render Blueprint — 앱(Render 프록시) 서비스 정의.
#   Render → New → Blueprint → 이 저장소 선택 → 비밀값(OPENAI_API_KEY 등)만 입력하면 끝난다.
#   (수동으로 만들려면 backend/README.md 의 3단계를 따른다)
services:
  - type: web
    name: ainewsroom-proxy
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    # Render 는 빈 Build Command 를 허용하지 않는다(대시보드 "Cannot be blank").
    # requirements.txt 는 주석뿐이라 이 명령은 사실상 무해하다(의존성 0).
    buildCommand: "pip install -r requirements.txt"
    startCommand: python server.py
    healthCheckPath: /ai/health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      # 녹취 전사(NAVER CLOVA Speech). 키는 이 서버에만 둔다. 호출 횟수·동시 처리 수는 CLOVA_RATE_PER_MIN(기본 5)·CLOVA_MAX_CONCURRENT(기본 2)
      - key: CLOVA_SPEECH_SECRET_KEY
        sync: false
      - key: CLOVA_SPEECH_INVOKE_URL
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      # 쓸 수 있는 계정(쉼표, '@donga.com' 같은 도메인 가능). 비우면 로그인한 모든 계정(사용자 테스트 기간)
      - key: ALLOWED_EMAILS
        sync: false
      # CMS 송고 계정. 비우면 아무도 송고할 수 없다
      - key: CMS_ALLOWED_EMAILS
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "120"
