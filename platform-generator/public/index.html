<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뉴스 카드 편집실</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2efe9;color:#242522;font-family:'Malgun Gothic',Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #dcd8cf;border-radius:12px;padding:11px 15px;background:#faf9f6;color:#242522}button:hover{background:#eae7df}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #557943}.dark{background:#262724;color:white}.dark:hover{background:#41443a}header{padding:24px 32px;border-bottom:1px solid #ddd8ce;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:21px;margin:4px 0}.eyebrow{font-size:11px;letter-spacing:2px;color:#727966}small,.muted{color:#73756c;font-size:13px;line-height:1.7}.layout{display:grid;grid-template-columns:245px minmax(350px,1fr) 235px;gap:20px;padding:24px;max-width:1600px;margin:auto}.panel{background:#fffefa;border:1px solid #e2ded5;border-radius:22px;padding:22px}h2{font-size:16px;margin:0 0 16px}.left{display:flex;flex-direction:column;gap:20px}.platform{display:flex;gap:12px;align-items:center;border:1px solid #dfdcd4;border-radius:15px;padding:16px;margin:10px 0}.platform:has(input:checked){background:#272824;color:white}.platform input{accent-color:#839f57;width:19px;height:19px}.photo-tools{margin-top:26px;padding-top:20px;border-top:1px solid #e2ded5}.photo-tools button{display:block;width:100%;margin:9px 0}.toolbar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.pill{background:#edf1e5;color:#566d3b;padding:6px 10px;border-radius:20px;font-size:12px}.stage{margin:auto;position:relative;overflow:hidden;background:#101010;box-shadow:0 12px 35px #0002}.scaled{position:absolute;left:0;top:0;transform-origin:top left}#status{min-height:24px;font-size:13px;line-height:1.7;margin-top:16px}#cards{max-height:75vh;overflow:auto;padding:3px}.thumb{display:block;width:100%;padding:10px;margin-bottom:14px;text-align:left}.thumb.selected{outline:2px solid #6f8750;background:#eef1e8}.mini{position:relative;overflow:hidden;pointer-events:none;background:#101010}.thumb-label{display:flex;justify-content:space-between;font-size:12px;margin-top:9px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row button{flex:1}.notice{font-size:12px;line-height:1.7;color:#686d60;margin:12px 0}dialog{border:1px solid #ddd8ce;border-radius:20px;padding:24px;width:min(820px,94vw);max-height:85vh}dialog::backdrop{background:#0006}#search-form{display:flex;gap:10px}input[type=search]{min-width:0;flex:1;padding:12px;border:1px solid #ccc;border-radius:10px}#results{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}#results img{width:100%;height:140px;object-fit:cover;border-radius:10px}#results a,#photo-credit a{color:#536640}#results small{display:block}#photo-credit{margin-top:12px;font-size:12px}a.download{display:inline-block;color:#4b6531;padding:12px} [hidden]{display:none!important}@media(max-width:1000px){.layout{grid-template-columns:195px minmax(300px,1fr) 170px;gap:10px;padding:12px}.panel{padding:14px}}@media(max-width:760px){header{padding:18px}.layout{grid-template-columns:1fr}.left{display:block}.platform{display:inline-flex;margin-right:6px}.photo-tools{margin-top:15px}#cards{display:flex;max-height:330px;gap:12px}.thumb{min-width:150px;width:150px}#results{grid-template-columns:1fr 1fr}}
</style><script src="/card-template.js"></script></head><body>
<header><div><div class="eyebrow">NEWSROOM / CONTENT STUDIO</div><h1>뉴스 카드 편집실</h1></div><div><button id="save">초안 저장</button> <button id="load">초안 불러오기</button></div></header>
<main class="layout"><aside class="left"><section class="panel"><h2>배포 플랫폼 선택</h2><small>다중 선택 가능</small><label class="platform"><input type="checkbox" value="instagram" checked>Instagram</label><label class="platform"><input type="checkbox" value="threads">Threads</label><label class="platform"><input type="checkbox" value="blog">Blog</label><p class="notice">현재는 Instagram 카드 편집 단계입니다. 플랫폼 선택값은 초안에 저장됩니다.</p><div class="photo-tools"><h2>선택한 카드의 사진</h2><button class="dark" id="unsplash">Unsplash 사진 검색</button><button id="local-photo">내 사진 불러오기</button><button id="remove-photo">검정 배경으로 변경</button><div id="photo-credit"></div></div></section><section class="panel"><h2>편집 안내</h2><small>오른쪽에서 카드를 선택하고 가운데 글자를 클릭해 수정하세요. 사진은 선택한 카드 한 장에 적용됩니다.</small><p class="notice">예시 카드 · AI 생성 및 재검수 연결 전</p></section></aside>
<section class="panel"><div class="toolbar"><h2 id="card-title">카드 편집</h2><span class="pill">4:5 · 1080 × 1350</span></div><div id="stage" class="stage"><div id="canvas" class="scaled"></div></div><p id="status" role="status" aria-live="polite"></p><div class="row"><button id="export" class="dark">현재 카드 JPG 다운로드</button></div><a id="download" class="download" hidden>생성된 JPG 저장</a><div class="row"><button id="up">앞으로</button><button id="down">뒤로</button><button id="delete">카드 삭제</button></div></section>
<aside class="panel"><div class="toolbar"><h2>전체 카드</h2><span id="count" class="pill"></span></div><div id="cards"></div><button id="add" style="width:100%">＋ 카드 추가</button><p class="notice">목록을 클릭하면 가운데에서 크게 편집합니다.</p></aside></main>
<input id="photo-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="draft-file" type="file" accept="application/json,.json" hidden>
<dialog id="photos"><div class="toolbar"><h2>Unsplash 사진 검색</h2><button id="close">닫기</button></div><form id="search-form"><input id="query" type="search" placeholder="예: city, technology, nature" required><button>검색</button></form><p id="photo-status" role="status"></p><div id="results"></div></dialog>
<script>
const $=id=>document.getElementById(id);const style=document.createElement('style');style.textContent=CardTemplate.css;document.head.append(style);
const uuid=()=>crypto.randomUUID();
let state={schema_version:1,platforms:['instagram'],cards:[{card_id:uuid(),keyword:'콘텐츠 제작',headline:'하나의 기사,\n여러 개의 이야기',body:'사용자가 방향을 선택하고\nAI가 초안 제작을 돕습니다.',source_evidence:[]},{card_id:uuid(),keyword:'사용자 중심',headline:'핵심 키워드는\n내가 직접 선택',body:'플랫폼과 요구사항을 정하고,\n생성된 문장을 검토하고 수정합니다.',source_evidence:[]},{card_id:uuid(),keyword:'최종 편집',headline:'읽고, 고치고,\n완성하기',body:'원문 근거를 확인한 뒤\n내가 원하는 카드로 완성합니다.',source_evidence:[]}],validation_status:'not_checked'},active=0,revision=0;
const current=()=>state.cards[active];
function tell(t){$('status').textContent=t}
function dirty(text=true){revision++;if(text)state.validation_status='needs_recheck';$('download').hidden=true;tell(text?'수정됨 · 원문 재검수 필요 (검수 기능 연결 전)':'사진 변경이 반영되었습니다.');drawList()}
function sizeStage(){const width=Math.min($('stage').parentElement.clientWidth-44,540);$('stage').style.width=width+'px';$('stage').style.height=width*1.25+'px';$('canvas').style.transform='scale('+width/1080+')'}
function drawList(){const list=$('cards');list.replaceChildren();state.cards.forEach((c,i)=>{const b=document.createElement('button');b.className='thumb'+(i===active?' selected':'');b.setAttribute('aria-label',(i+1)+'번 카드 선택');const mini=document.createElement('div');mini.className='mini';const inner=document.createElement('div');inner.className='scaled';inner.innerHTML=CardTemplate.markup(c);mini.append(inner);const label=document.createElement('div');label.className='thumb-label';label.textContent=(i+1)+' / '+(i===0?'표지':i===state.cards.length-1?'마무리':'본문');b.append(mini,label);b.onclick=()=>{active=i;draw()};list.append(b);const w=Math.max(90,b.clientWidth-22);mini.style.height=w*1.25+'px';inner.style.transform='scale('+w/1080+')'});$('count').textContent=state.cards.length+'장';$('up').disabled=active===0;$('down').disabled=active===state.cards.length-1;$('delete').disabled=state.cards.length<=1}
function draw(){const c=current();$('canvas').innerHTML=CardTemplate.markup(c,true);$('card-title').textContent=(active+1)+'번 카드 편집';$('download').hidden=true;sizeStage();drawList();const credit=$('photo-credit');credit.replaceChildren();if(c.image?.photographer){const a=document.createElement('a');a.href='https://unsplash.com/?utm_source=news_card_editor&utm_medium=referral';try{const u=new URL(c.image.profile);if(u.hostname==='unsplash.com'){u.searchParams.set('utm_source','news_card_editor');u.searchParams.set('utm_medium','referral');a.href=u.href}}catch{}a.target='_blank';a.rel='noopener';a.textContent=c.image.photographer+' / Unsplash';credit.append(a)}tell('글자를 클릭하면 바로 수정할 수 있습니다.');}
$('canvas').addEventListener('input',e=>{const field=e.target.dataset.field;if(['keyword','headline','body'].includes(field)){current()[field]=e.target.innerText;dirty()}});
$('canvas').addEventListener('paste',e=>{if(!e.target.dataset.field)return;e.preventDefault();const text=e.clipboardData.getData('text/plain');const s=window.getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0);r.deleteContents();const n=document.createTextNode(text);r.insertNode(n);r.setStartAfter(n);r.collapse(true);s.removeAllRanges();s.addRange(r);current()[e.target.dataset.field]=e.target.innerText;dirty()});
$('canvas').addEventListener('dblclick',e=>{if(e.target.classList.contains('shade')||e.target.classList.contains('photo'))$('photos').showModal()});
document.querySelectorAll('.platform input').forEach(el=>el.onchange=()=>{state.platforms=[...document.querySelectorAll('.platform input:checked')].map(e=>e.value);tell('플랫폼 선택값이 변경되었습니다. 생성 기능은 다음 단계에서 연결합니다.')});
$('add').onclick=()=>{if(state.cards.length>=10)return tell('현재 편집 화면은 최대 10장까지 지원합니다.');state.cards.push({card_id:uuid(),keyword:'키워드',headline:'새 카드 제목',body:'내용을 입력하세요.',source_evidence:[]});active=state.cards.length-1;dirty();draw()};
$('delete').onclick=()=>{if(state.cards.length===1)return;if(!confirm('선택한 카드를 삭제할까요?'))return;state.cards.splice(active,1);active=Math.min(active,state.cards.length-1);dirty();draw()};
function move(d){const next=active+d;if(next<0||next>=state.cards.length)return;[state.cards[active],state.cards[next]]=[state.cards[next],state.cards[active]];active=next;dirty();draw()}
$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);
$('local-photo').onclick=()=>$('photo-file').click();$('photo-file').onchange=async e=>{const file=e.target.files[0],target=current();e.target.value='';if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>4*1024*1024)return tell('PNG/JPG/WebP 4MB 이하 사진을 선택해주세요.');const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{target.image={url:reader.result};dirty(false);draw()};img.onerror=()=>tell('읽을 수 없는 이미지입니다.');img.src=reader.result};reader.readAsDataURL(file)};
$('remove-photo').onclick=()=>{delete current().image;dirty(false);draw()};$('unsplash').onclick=()=>$('photos').showModal();$('close').onclick=()=>$('photos').close();
async function api(url,options){const r=await fetch(url,options);let data;try{data=await r.json()}catch{throw Error('서버 연결을 확인해주세요. editor-routes.js를 연결한 뒤 서버를 다시 실행해야 합니다.')}if(!r.ok)throw Error(data.error||'요청 실패');return data}
$('search-form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;$('photo-status').textContent='검색 중…';$('results').replaceChildren();try{const data=await api('/editor/photos?q='+encodeURIComponent($('query').value));$('photo-status').textContent=data.photos.length?'사진을 선택하면 현재 카드에 적용됩니다.':'검색 결과가 없습니다.';data.photos.forEach(p=>{const box=document.createElement('div'),b=document.createElement('button'),img=document.createElement('img'),a=document.createElement('a');img.src=p.thumb;img.alt=p.photographer+'의 사진';b.append(img);a.href=p.profile+'?utm_source=news_card_editor&utm_medium=referral';a.target='_blank';a.rel='noopener';a.textContent=p.photographer;const small=document.createElement('small');small.append('Photo by ',a,' on Unsplash');box.append(b,small);$('results').append(box);b.onclick=async()=>{const target=current();b.disabled=true;try{await api('/editor/photos/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:p.id})});target.image=p;dirty(false);draw();$('photos').close()}catch(e){$('photo-status').textContent=e.message}finally{b.disabled=false}}})}catch(e){$('photo-status').textContent=e.message}finally{button.disabled=false}};
$('save').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='news-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);tell('사진과 편집 내용을 JSON으로 저장했습니다.')};$('load').onclick=()=>$('draft-file').click();
$('draft-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>50*1024*1024)throw Error('50MB 이하 초안을 선택해주세요.');const d=JSON.parse(await file.text());const cards=d.cards||d.output?.cards;if(!Array.isArray(cards)||cards.length<1||cards.length>10)throw Error('cards 또는 output.cards에 1~10장 카드가 필요합니다.');const normalized=cards.map(c=>{const v=c.content||c;return {...c,card_id:c.card_id||uuid(),keyword:String(v.keyword||''),headline:String(v.headline||''),body:String(v.body||''),image:c.image?.url?{...c.image,url:CardTemplate.validImage(c.image.url)}:undefined}});if(!confirm('현재 편집 내용을 불러온 초안으로 바꿀까요?'))return;state={...d,schema_version:1,cards:normalized,platforms:Array.isArray(d.platforms)?d.platforms.filter(x=>['instagram','threads','blog'].includes(x)):['instagram'],validation_status:'not_checked'};active=0;revision++;document.querySelectorAll('.platform input').forEach(x=>x.checked=state.platforms.includes(x.value));draw();tell('초안을 불러왔습니다. 검수 상태는 다시 확인해야 합니다.')}catch(e){tell('불러오기 실패: '+e.message)}};
$('export').onclick=async()=>{const c=structuredClone(current()),version=revision;const button=$('export');button.disabled=true;tell('현재 카드를 JPG로 출력 중입니다…');try{const data=await api('/editor/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({card:c})});if(version!==revision||current().card_id!==c.card_id){tell('출력 중 카드가 변경되었습니다. 다시 출력해주세요.');return}$('download').href=data.image_url;$('download').download=data.file_name;$('download').hidden=false;$('download').click();tell('JPG가 생성되었습니다. 다운로드가 시작되지 않으면 아래 링크를 누르세요.')}catch(e){tell(e.message)}finally{button.disabled=false}};
window.addEventListener('resize',()=>{sizeStage();drawList()});window.addEventListener('beforeunload',e=>{if(revision>0){e.preventDefault();e.returnValue=''}});draw();
</script>

<!-- 방금 추가한 편집 연결 코드 -->
<script>
window.CardEditor = {
  getRevision() {
    return revision;
  },

  applyInstagramDraft(draft, expectedRevision) {
    if (revision !== expectedRevision) {
      throw new Error(
        "생성 중 기존 카드가 수정되었습니다. 편집 내용을 저장하고 다시 생성해주세요."
      );
    }

    if (
      draft?.platform !== "instagram" ||
      !Array.isArray(draft.cards) ||
      draft.cards.length < 3 ||
      draft.cards.length > 10
    ) {
      throw new Error(
        "현재 편집 화면에는 Instagram 카드 3~10장을 적용할 수 있습니다."
      );
    }

    // 서버의 content 안에 있는 글을 기존 편집 화면 형식으로 변환
    const cards = draft.cards.map((card, index) => {
      const content = card.content;

      if (
        !content ||
        typeof content.keyword !== "string" ||
        typeof content.headline !== "string" ||
        typeof content.body !== "string"
      ) {
        throw new Error("생성된 카드의 텍스트 형식이 올바르지 않습니다.");
      }

      return {
        card_id: card.card_id || crypto.randomUUID(),
        page: index + 1,
        role: card.role,

        keyword: content.keyword,
        headline: content.headline,
        body: content.body,

        source_evidence: card.source_evidence || [],
        evidence_valid: card.evidence_valid === true,
      };
    });

    // 생성된 카드를 새로운 편집 초안으로 적용
    state = {
    ...state,
      schema_version: 1,
      platform: "instagram",

      platforms: [
        ...document.querySelectorAll(".platform input:checked"),
      ].map((input) => input.value),

      article_id: draft.article_id,
      selected_keywords: draft.selected_keywords,
      requirements: draft.requirements,

      core_text: draft.core_text,
      recommended_card_count: draft.recommended_card_count,
      card_count_reason: draft.card_count_reason,

      cards,
      validation_status: "not_checked",
    };

    active = 0;
    revision++;

    draw();

    tell(
      `${cards.length}장의 카드가 생성되었습니다. 글자를 클릭해 수정하세요. 전체 내용 검수는 아직 진행하지 않았습니다.`
    );

    const notice = document.querySelector(
      ".left > .panel:nth-child(2) .notice"
    );

    if (notice) {
      notice.textContent =
        "AI 생성 초안 · 텍스트 수정 가능 · 전체 내용 검수 연결 전";
    }
  },
};
</script>
